services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: metro
      RABBITMQ_DEFAULT_PASS: metro_dev
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  core-api:
    profiles: [container]
    image: ${IMAGE_PREFIX:-metro-local}/core-api:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: core-api
    environment:
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  validation-service:
    profiles: [container]
    image: ${IMAGE_PREFIX:-metro-local}/validation-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: validation-service
    environment:
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    profiles: [container]
    image: ${IMAGE_PREFIX:-metro-local}/notification-service:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      PORT: 3003
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    profiles: [container]
    image: ${IMAGE_PREFIX:-metro-local}/frontend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:

