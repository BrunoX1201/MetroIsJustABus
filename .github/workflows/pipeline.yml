name: CI and deployable images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container_smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build the four images
        run: docker compose --profile container build
      - name: Start the complete stack
        run: docker compose --profile container up -d --no-build --wait
      - name: Check every service and the frontend proxy
        run: node scripts/smoke.mjs
      - name: Stop the temporary stack
        if: always()
        run: docker compose --profile container down --volumes

  publish:
    name: publish-${{ matrix.service }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, container_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: frontend/Dockerfile
            build_args: ''
          - service: core-api
            dockerfile: backend/Dockerfile
            build_args: SERVICE=core-api
          - service: validation-service
            dockerfile: backend/Dockerfile
            build_args: SERVICE=validation-service
          - service: notification-service
            dockerfile: backend/Dockerfile
            build_args: SERVICE=notification-service
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Normalize the GHCR namespace
        id: registry
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          push: true
          tags: ${{ steps.registry.outputs.prefix }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  verify_published:
    name: verify-published-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Select the images for this commit
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published images
        run: docker compose --profile container pull
      - name: Start the published version
        run: docker compose --profile container up -d --no-build --wait
      - name: Verify the published version
        run: node scripts/smoke.mjs
      - name: Record the deployable version
        run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: metroisjustabus-sha-${{ github.sha }}
          path: release/manifest.json
      - name: Stop the temporary stack
        if: always()
        run: docker compose --profile container down --volumes
